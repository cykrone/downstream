name: Sim core tests

# Builds the engine-independent sim core against .NET Standard 2.1 (Unity's API surface)
# and runs its tests with plain NUnit. Needs no Unity licence, so it runs on every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build core (netstandard2.1, warnings as errors)
        run: dotnet build Tools/DotnetTests/Core/Downstream.Core.csproj -c Release
      - name: Run core tests
        run: dotnet test Tools/DotnetTests/Tests/Downstream.Core.Tests.csproj -c Release --logger "trx;LogFileName=core-tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: Tools/DotnetTests/Tests/TestResults
